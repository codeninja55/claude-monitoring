# Grafana Mimir — monolithic mode, filesystem storage
multitenancy_enabled: false

server:
  http_listen_port: 9009
  grpc_listen_port: 9095

common:
  storage:
    backend: filesystem
    filesystem:
      dir: /data/mimir/blocks

distributor:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist

ingester:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist
    replication_factor: 1

store_gateway:
  sharding_ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist

compactor:
  data_dir: /data/mimir/compactor
  sharding_ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/mimir/blocks
  tsdb:
    dir: /data/mimir/tsdb
    retention_period: 8760h

ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/mimir/rules

limits:
  compactor_blocks_retention_period: 8760h
  native_histograms_ingestion_enabled: true

activity_tracker:
  filepath: /data/mimir/activity.log
